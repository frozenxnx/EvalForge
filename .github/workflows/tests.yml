name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Some tests drive the viewer's JavaScript with node; they skip without it.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server]" httpx pytest

      - name: Test
        run: python -m pytest -q
