[project]
name = "llmobs"
version = "0.1.0"
description = "Tracing, experiment runner, and (soon) evaluators for LLM applications"
requires-python = ">=3.10"
dependencies = []                       # the SDK is stdlib-only

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["llmobs*", "llmobs_server*", "llmobs_eval*"]

[tool.setuptools.package-data]
llmobs_server = ["static/*.html"]
